<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha Naval</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="batalhaNaval.css">
</head>
<body>

    <div class="jogo">
        <header class="cabecalho">
            <h1>Batalha Naval</h1>
            <p>Há três navios escondidos no mapa. Afunde todos com o menor número de tiros.</p>
        </header>

        <section class="campo" aria-label="Mapa de batalha">
            <div class="status">
                <div class="numeros">
                    <div>
                        <span class="rotulo">Tiros</span>
                        <span class="valor" id="tiros">0</span>
                    </div>
                    <div>
                        <span class="rotulo">Recorde</span>
                        <span class="valor" id="recorde">–</span>
                    </div>
                </div>
                <p class="mensagem" id="mensagem" role="status" aria-live="polite"></p>
            </div>

            <div class="tabuleiro" id="tabuleiro"></div>
        </section>

        <aside class="painel">
            <h2>Frota inimiga</h2>
            <ul class="frota" id="frota"></ul>
            <button type="button" class="btn-reiniciar" id="btn-reiniciar">Novo jogo</button>
        </aside>
    </div>
    <script src="batalhaNaval.js"></script>
</body>
</html>
